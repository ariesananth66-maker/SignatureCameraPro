name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Audit APK permissions and checksum
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > manifest-tree.txt
          grep -q "android.permission.CAMERA" manifest-tree.txt
          grep -q "android.permission.RECORD_AUDIO" manifest-tree.txt
          if grep -Eq "android.permission.(INTERNET|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_SMS|SEND_SMS)" manifest-tree.txt; then
            echo "Unexpected sensitive permission in APK manifest"; exit 1
          fi

          # Verify the package/version metadata in the built artifact, not just Gradle source.
          "$AAPT" dump badging "$APK" > apk-badging.txt
          grep -q "package: name='com.ariesanth.signaturecamerapro' versionCode='12' versionName='1.1.1'" apk-badging.txt

          # Confirm the APK is aligned and has a valid installable signature.
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

          sha256sum "$APK" > "$APK.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: signature-camera-pro-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
