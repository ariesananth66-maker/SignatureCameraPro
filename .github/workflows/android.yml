name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Audit APK permissions and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          test -s "$APK"
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          grep -Fq "uses-permission: name='android.permission.CAMERA'" apk-permissions.txt
          grep -Fq "uses-permission: name='android.permission.RECORD_AUDIO'" apk-permissions.txt

          # This app must not request network, contacts, location, SMS or other
          # unrelated sensitive permissions. Match permission names literally.
          if grep -Eq "uses-permission.*name='android\\.permission\\.(INTERNET|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_SMS|SEND_SMS)'" apk-permissions.txt; then
            echo "Unexpected sensitive permission in APK manifest"
            exit 1
          fi

          # Verify package and version metadata against the app module configuration.
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -Fq "package: name='com.ananthrajan.signaturecamerapro' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" apk-badging.txt

          # Confirm alignment and APK signing integrity.
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Build signed release APK when signing secrets are configured
        id: release_build
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
            echo "Release signing secrets are not configured; skipping signed release build."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/signature-camera-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" \
          ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
          ANDROID_KEY_ALIAS="$KEY_ALIAS" \
          ANDROID_KEY_PASSWORD="$KEY_PASSWORD" \
            gradle assembleRelease
          RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          test -s "$RELEASE_APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$RELEASE_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RELEASE_APK"
          "$BUILD_TOOLS/aapt" dump badging "$RELEASE_APK" | grep -Fq "package: name='com.ananthrajan.signaturecamerapro' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          sha256sum "$RELEASE_APK" | tee "$RELEASE_APK.sha256"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        if: steps.release_build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signature-camera-pro-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: signature-camera-pro-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
