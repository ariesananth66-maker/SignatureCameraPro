name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Audit APK permissions and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          test -s "$APK"
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          grep -Fq "uses-permission: name='android.permission.CAMERA'" apk-permissions.txt
          grep -Fq "uses-permission: name='android.permission.RECORD_AUDIO'" apk-permissions.txt

          # This app must not request network, contacts, location, SMS or other
          # unrelated sensitive permissions. Match permission names literally.
          if grep -Eq "uses-permission.*name='android\\.permission\\.(INTERNET|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_SMS|SEND_SMS)'" apk-permissions.txt; then
            echo "Unexpected sensitive permission in APK manifest"
            exit 1
          fi

          # Verify package and version metadata in the actual built APK.
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -Fq "package: name='com.ananthrajan.signaturecamerapro' versionCode='15' versionName='1.1.4'" apk-badging.txt

          # Confirm alignment and APK signing integrity.
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: signature-camera-pro-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
